# Publishes live-demo/ to GitHub Pages. The wasm is built here, not
# committed; set Settings > Pages > Source to "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Downloaded, not piped: a piped script shares stdin with its source.
      - name: install minc
        run: |
          curl -fsSL https://minc.dev/install -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" < /dev/null
          echo "$HOME/.minc" >> "$GITHUB_PATH"

      - run: minc --version

      # LIST_WASM.txt is the wasm census the publisher ran: every stem in
      # it built and survived a headless run. LIST_WASM_WGPU.txt is the
      # WebGPU census, built again with -D SOKOL_WGPU so the shaders come
      # out as WGSL. A failed build fails the job: the gallery links are a
      # fixed list, and a missing .wasm is a dead link.
      - name: build live-demo
        run: |
          while read -r stem; do
            [ -n "$stem" ] || continue
            echo "--- $stem"
            minc "samples/$stem.mc" --target wasm -DSOKOL_TRACE_HOOKS -o "live-demo/$stem.wasm"
          done < samples/LIST_WASM.txt
          while read -r stem; do
            [ -n "$stem" ] || continue
            echo "--- $stem (webgpu)"
            minc "samples/$stem.mc" --target wasm -DSOKOL_WGPU -DSOKOL_TRACE_HOOKS -o "live-demo/$stem.wgpu.wasm"
          done < samples/LIST_WASM_WGPU.txt

      # The samples ship their own wasm hosts rather than depend on the
      # one in a user's minc install; the gallery serves those copies.
      # data/ sits beside the pages for the sokol_fetch paths.
      - name: stage hosts + assets
        run: |
          cp samples/sokol_wasm_host.js live-demo/
          cp samples/sokol_wgpu_host.js live-demo/
          cp samples/sokol_wasm_audio_worklet.js live-demo/
          cp -R data live-demo/data

      # index.html's list is hand-written. Fail the job rather than publish
      # a dead link, or a sample nothing links to. The parse below needs
      # the flags on the item's `id:` line.
      - name: check the gallery lists exactly what was built
        run: |
          grep "id: '" live-demo/index.html | grep -v "only: 'wgpu'" \
            | sed "s/.*id: '\([^']*\)'.*/\1/" | LC_ALL=C sort > /tmp/listed_gl
          grep "id: '" live-demo/index.html | grep -e "wgpu: true" -e "only: 'wgpu'" \
            | sed "s/.*id: '\([^']*\)'.*/\1/" | LC_ALL=C sort > /tmp/listed_wgpu
          for w in live-demo/*.wasm; do basename "$w" .wasm; done \
            | grep -v '\.wgpu$' | LC_ALL=C sort > /tmp/built_gl
          for w in live-demo/*.wgpu.wasm; do basename "$w" .wgpu.wasm; done \
            | LC_ALL=C sort > /tmp/built_wgpu
          diff /tmp/listed_gl /tmp/built_gl \
            || { echo "index.html vs LIST_WASM.txt (< listed, > built)"; exit 1; }
          diff /tmp/listed_wgpu /tmp/built_wgpu \
            || { echo "index.html wgpu flags vs LIST_WASM_WGPU.txt (< listed, > built)"; exit 1; }

      - run: ls -l live-demo

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live-demo

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
